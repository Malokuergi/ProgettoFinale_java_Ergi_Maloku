<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>
    <header th:replace="~{index :: navbar}"></header>

    <main class="min-vh-100">
        <section class="bg-body-tertiary py-5">
            <div class="container">
                <p class="text-uppercase text-secondary fw-semibold mb-2">Aulab Chronicle</p>
                <h1 class="display-5 fw-bold mb-0" th:text="${title}">
                    Richiesta collaborazione
                </h1>
            </div>
        </section>

        <section class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-8">
                    <div class="card shadow-sm">
                        <div class="card-body p-4 p-md-5">
                            <form th:action="@{/operations/career/request/save}" method="post"
                                th:object="${careerRequest}" enctype="multipart/form-data">

                                <div class="mb-4">
                                    <label for="body" class="form-label fw-semibold">
                                        Motivo della richiesta
                                    </label>
                                    <textarea id="body" class="form-control" rows="6" th:field="*{body}"
                                        placeholder="Descrivi la tua motivazione..."></textarea>
                                </div>

                                <div class="mb-4">
                                    <label for="role" class="form-label fw-semibold">
                                        Per quale ruolo?
                                    </label>
                                    <select id="role" th:field="*{role}" class="form-select">
                                        <option th:each="r : ${roles}" th:value="${r.id}"
                                            th:text="${#strings.substring(r.name, 5)}">
                                        </option>
                                    </select>
                                </div>

                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-paper-plane me-2"></i>
                                    Effettua richiesta
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
