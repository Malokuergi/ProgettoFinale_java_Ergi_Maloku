<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>
    <header th:replace="~{index :: navbar}"></header>

    <main class="min-vh-100">
        <section class="bg-body-tertiary py-5">
            <div class="container">
                <p class="text-uppercase text-secondary fw-semibold mb-2">Aulab Chronicle</p>
                <h1 class="display-5 fw-bold mb-0" th:text="${title}">
                    Inserisci una categoria
                </h1>
            </div>
        </section>

        <section class="container py-5">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="card shadow-sm">
                        <div class="card-body p-4 p-md-5">
                            <form th:action="@{/categories}" method="post" th:object="${category}">
                                <div class="mb-4">
                                    <label for="name" class="form-label fw-semibold">
                                        Nome categoria
                                    </label>
                                    <input id="name" type="text" class="form-control" th:field="*{name}"
                                        placeholder="Inserisci il nome della categoria...">
                                    <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}"
                                        class="text-danger small mt-1 mb-0"></p>
                                </div>

                                <button type="submit" class="btn btn-primary">
                                    <i class="fa-solid fa-plus me-2"></i>Crea categoria
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
