<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>
    <header th:replace="~{index :: navbar}"></header>

    <main>
        <section class="bg-body-tertiary py-5">
            <div class="container">
                <p class="text-uppercase text-secondary fw-semibold mb-2">Aulab Chronicle</p>
                <h1 class="display-5 fw-bold mb-2">Dettaglio articolo</h1>
                <h2 class="h4 text-secondary mb-0" th:text="${article.title}">Titolo</h2>
            </div>
        </section>

        <article class="container my-5">
            <div class="row justify-content-center">
                <div class="col-12 col-lg-9">
                    <div class="card shadow-sm overflow-hidden">
                        <div class="ratio ratio-16x9">
                            <img th:if="${article.image != null}" th:src="${article.image.path}"
                                class="card-img-top object-fit-cover" alt="Immagine dell'articolo">

                            <img th:unless="${article.image != null}" th:src="@{/images/default.jpg}"
                                class="card-img-top object-fit-cover" alt="Immagine predefinita dell'articolo">
                        </div>

                        <div class="card-body p-4 p-md-5">
                            <h2 class="h3 fw-bold mb-3" th:text="${article.subtitle}">
                                Sottotitolo
                            </h2>

                            <div class="d-flex flex-wrap align-items-center gap-3 text-secondary mb-4">
                                <span th:if="${article.category != null}">
                                    <i class="fa-solid fa-tag me-1"></i>
                                    <a th:href="@{/categories/search/{id}(id=${article.category.id})}"
                                        class="text-capitalize link-secondary fw-semibold"
                                        th:text="${article.category.name}">
                                        Categoria
                                    </a>
                                </span>

                                <span th:unless="${article.category != null}">
                                    <i class="fa-solid fa-tag me-1"></i>Nessuna categoria
                                </span>

                                <span>
                                    <i class="fa-regular fa-calendar me-1"></i>
                                    <span th:text="${article.publishDate}">Data</span>
                                </span>

                                <span>
                                    <i class="fa-regular fa-user me-1"></i>
                                    <a th:href="@{/search/{id}(id=${article.user.id})}" class="link-secondary"
                                        th:text="${article.user.username}">
                                        Autore
                                    </a>
                                </span>
                            </div>

                            <hr class="my-4">

                            <p class="lh-lg mb-4" th:text="${article.body}"></p>

                            <button type="button" class="btn btn-outline-secondary" onclick="window.history.back()">
                                <i class="fa-solid fa-arrow-left me-2"></i>Torna indietro
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </article>
    </main>

    <footer th:replace="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
