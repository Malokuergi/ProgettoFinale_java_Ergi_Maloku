<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>
    <header th:replace="~{index :: navbar}"></header>

    <main class="min-vh-100">
        <div class="container mt-4">
            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                <p class="mb-0" th:text="${successMessage}"></p>
            </div>
        </div>

        <section class="bg-body-tertiary py-5">
            <div class="container">
                <p class="text-uppercase text-secondary fw-semibold mb-2">Aulab Chronicle</p>
                <h1 class="display-5 fw-bold mb-0" th:text="${title}">Articoli</h1>
            </div>
        </section>

        <section class="container py-5" th:if="${articles.size() > 0}">
            <div class="row g-4">
                <div th:each="article : ${articles}" class="col-12 col-md-6 col-lg-4">
                    <article class="card h-100 shadow-sm">
                        <div class="ratio ratio-16x9">
                            <img th:if="${article.image != null}" th:src="${article.image.path}"
                                class="card-img-top object-fit-cover" alt="Immagine dell'articolo">

                            <img th:unless="${article.image != null}" th:src="@{/images/default.jpg}"
                                class="card-img-top object-fit-cover" alt="Immagine predefinita dell'articolo">
                        </div>

                        <div class="card-body d-flex flex-column">
                            <p class="small text-secondary mb-2">
                                <i class="fa-regular fa-user me-1"></i>
                                <span th:text="${article.user.username}">Autore</span>
                            </p>

                            <h2 class="card-title h5 fw-bold" th:text="${article.title}"></h2>
                            <p class="card-text text-secondary" th:text="${article.subtitle}"></p>

                            <a th:href="@{/articles/detail/{id}(id=${article.id})}"
                                class="btn btn-primary mt-auto align-self-start">
                                Leggi <i class="fa-solid fa-arrow-right ms-1"></i>
                            </a>
                        </div>
                    </article>
                </div>
            </div>
        </section>

        <section class="container py-5 text-center" th:unless="${articles.size() > 0}">
            <div class="py-5">
                <i class="fa-regular fa-newspaper fa-3x text-secondary mb-3"></i>
                <h2 class="h4 fw-bold">Nessun articolo presente</h2>
                <p class="text-secondary mb-0">Torna presto per leggere le nuove pubblicazioni.</p>
            </div>
        </section>
    </main>

    <footer th:replace="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
