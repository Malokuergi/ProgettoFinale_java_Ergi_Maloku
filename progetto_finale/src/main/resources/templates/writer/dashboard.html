<!DOCTYPE html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">

<head th:insert="~{index :: head}"></head>

<body>
    <header th:replace="~{index :: navbar}"></header>

    <main class="min-vh-100">
        <div class="container pt-4">
            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                <p class="mb-0" th:text="${successMessage}"></p>
            </div>
        </div>

        <section class="bg-body-tertiary py-5">
            <div class="container">
                <p class="text-uppercase text-secondary fw-semibold mb-2">Area di lavoro</p>
                <h1 class="display-5 fw-bold mb-2">Dashboard scrittore</h1>
                <p class="lead text-secondary mb-0" th:text="${title}">I tuoi articoli</p>
            </div>
        </section>

        <section class="container py-5">
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle mb-0">
                            <thead class="table-dark">
                                <tr>
                                    <th scope="col">ID</th>
                                    <th scope="col">Titolo</th>
                                    <th scope="col">Sottotitolo</th>
                                    <th scope="col">Categoria</th>
                                    <th scope="col" class="text-end">Azioni</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="article : ${articles}">
                                    <td th:text="${article.id}"></td>
                                    <td class="fw-semibold" th:text="${article.title}"></td>
                                    <td th:text="${article.subtitle}"></td>
                                    <td>
                                        <span th:if="${article.category != null}"
                                            th:text="${article.category.name}"></span>
                                        <span th:unless="${article.category != null}" class="text-secondary">Nessuna
                                            categoria</span>
                                    </td>
                                    <td class="text-end">
                                        <div class="d-inline-flex flex-wrap gap-2">
                                            <a th:href="@{/articles/detail/{id}(id=${article.id})}"
                                                class="btn btn-primary btn-sm" aria-label="Leggi articolo"
                                                title="Leggi articolo">
                                                <i class="fa-solid fa-bars"></i>
                                            </a>

                                            <a th:href="@{/articles/edit/{id}(id=${article.id})}"
                                                class="btn btn-warning btn-sm" aria-label="Modifica articolo"
                                                title="Modifica articolo">
                                                <i class="fa-solid fa-pen"></i>
                                            </a>

                                            <a th:href="@{/articles/delete/{id}(id=${article.id})}"
                                                class="btn btn-danger btn-sm" aria-label="Elimina articolo"
                                                title="Elimina articolo">
                                                <i class="fa-solid fa-trash"></i>
                                            </a>
                                        </div>
                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(articles)}">
                                    <td colspan="5" class="text-center py-5">
                                        <i class="fa-regular fa-newspaper fa-2x text-secondary mb-3"></i>
                                        <p class="fw-semibold mb-1">Non hai ancora articoli</p>
                                        <p class="text-secondary mb-0">
                                            Gli articoli che creerai appariranno qui.
                                        </p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer th:replace="~{index :: footer}"></footer>
    <script th:replace="~{index :: bootstrapScript}"></script>
</body>

</html>
