<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <title th:text="${title}">Aulab Chronicle</title>
</head>

<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">
                <i class="fa-solid fa-newspaper me-2"></i>Aulab Chronicle
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Apri il menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li sec:authorize="isAuthenticated && hasRole('WRITER')" class="nav-item">
                        <a class="nav-link" href="/articles/create">
                            <i class="fa-solid fa-pen-to-square me-1"></i>Crea articolo
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/articles">Tutti gli articoli</a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                        <a class="nav-link" href="/admin/dashboard">
                            Dashboard Admin
                            <span class="badge rounded-pill bg-danger" th:text="${careerRequests}"></span>
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('REVISOR')">
                        <a class="nav-link" href="/revisor/dashboard">
                            Dashboard revisor
                            <span class="badge rounded-pill bg-danger" th:if="${articlesToBeRevised > 0}"
                                th:text="${articlesToBeRevised}"></span>
                        </a>
                    </li>

                    <li class="nav-item" sec:authorize="hasRole('WRITER')">
                        <a class="nav-link" href="/writer/dashboard">Dashboard writer</a>
                    </li>

                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            Accesso
                        </a>

                        <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <li sec:authorize="isAnonymous()">
                                <a class="dropdown-item" th:href="@{/register}">Registrati</a>
                            </li>
                            <li sec:authorize="isAnonymous()">
                                <a class="dropdown-item" th:href="@{/login}">Accedi</a>
                            </li>
                            <li sec:authorize="isAuthenticated()">
                                <a class="dropdown-item" th:href="@{/logout}">Esci</a>
                            </li>
                        </ul>
                    </li>
                </ul>

                <form class="d-flex my-2 my-lg-0 me-lg-3" th:action="@{/articles/search}" method="get">
                    <input class="form-control me-2" type="search" placeholder="Cerca articoli" name="keyword"
                        aria-label="Cerca articoli">
                    <button class="btn btn-outline-light" type="submit">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </form>

                <div sec:authorize="isAuthenticated" class="text-white small mt-2 mt-lg-0"
                    th:text="'Benvenuto: ' + ${#authentication.principal.fullname} + ' ' + ${#authentication.principal.authorities[0].authority.replace('ROLE_', '')}">
                    Benvenuto
                </div>
            </div>
        </div>
    </nav>

    <footer th:fragment="footer" class="bg-dark text-white pt-4 mt-5">
        <div class="container">
            <div class="row justify-content-between align-items-center">
                <div class="col-md-6 mb-3">
                    <a href="/" class="text-white text-decoration-none">
                        <h5 class="mb-1">Aulab IT</h5>
                    </a>
                    <p class="text-white-50 mb-0">Storie, notizie e idee da leggere.</p>
                </div>

                <div class="col-md-6 mb-3 text-md-end">
                    <h5 class="h6">Lavora con noi</h5>
                    <a th:href="@{/operations/career/request}" class="btn btn-primary">
                        <i class="fa-solid fa-paper-plane me-1"></i>Richiedi
                    </a>
                </div>
            </div>
        </div>

        <div class="bg-secondary text-center py-2">
            <small>© 2026 Aulab Jost. Tutti i diritti riservati.</small>
        </div>
    </footer>

    <script th:fragment="bootstrapScript"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
